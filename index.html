<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f9fafb;
  --border: #e4e7ec;
  --text: #1a1d24;
  --text-soft: #667085;
  --text-faint: #98a2b3;
  --accent: #4f46e5;
  --accent-soft: #eef2ff;
  --uni: #0ea5e9;
  --uni-soft: #e0f2fe;
  --work: #f59e0b;
  --work-soft: #fef3c7;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --ok: #10b981;
  --ok-soft: #d1fae5;
  --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.14);
  --radius: 14px;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #0f1115;
    --surface: #191c22;
    --surface-2: #21252d;
    --border: #2b303a;
    --text: #e7eaf0;
    --text-soft: #98a2b3;
    --text-faint: #667085;
    --accent: #818cf8;
    --accent-soft: #26243b;
    --uni-soft: #0b2d3f;
    --work-soft: #3a2e0b;
    --danger-soft: #3a1f1f;
    --ok-soft: #0e2f26;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #191c22;
  --surface-2: #21252d;
  --border: #2b303a;
  --text: #e7eaf0;
  --text-soft: #98a2b3;
  --text-faint: #667085;
  --accent: #818cf8;
  --accent-soft: #26243b;
  --uni-soft: #0b2d3f;
  --work-soft: #3a2e0b;
  --danger-soft: #3a1f1f;
  --ok-soft: #0e2f26;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }

/* Header */
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  display: grid; place-items: center; color: #fff; flex-shrink: 0;
}
.logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.logo p { font-size: 13px; color: var(--text-soft); }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-soft); cursor: pointer;
  display: grid; place-items: center; transition: .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.stat .num { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.stat .lbl { font-size: 12px; color: var(--text-soft); font-weight: 500; margin-top: 2px; }
.stat .bar { height: 6px; background: var(--surface-2); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
.tab {
  border: none; background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 500; color: var(--text-soft); transition: .15s;
}
.tab.active { background: var(--accent-soft); color: var(--accent); }
.grow { flex: 1; min-width: 160px; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%;
  transition: .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select { cursor: pointer; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.search input { padding-left: 38px; }
.btn {
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border: none;
  border-radius: 10px; padding: 10px 18px; display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff; transition: .15s; white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.ghost:hover { background: var(--surface-2); }

/* Task list */
.list { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start;
  transition: .15s; position: relative; overflow: hidden;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.card.cat-universidad::before { background: var(--uni); }
.card.cat-trabajo::before { background: var(--work); }
.card.done { opacity: .62; }
.card.done .title { text-decoration: line-through; }
.check {
  width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
  cursor: pointer; flex-shrink: 0; margin-top: 2px; display: grid; place-items: center;
  color: #fff; transition: .15s; background: transparent;
}
.check.on { background: var(--ok); border-color: var(--ok); }
.card-body { flex: 1; min-width: 0; }
.card-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.title { font-weight: 600; font-size: 15px; word-break: break-word; }
.chip {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap;
}
.chip.universidad { background: var(--uni-soft); color: var(--uni); }
.chip.trabajo { background: var(--work-soft); color: var(--work); }
.chip.alta { background: var(--danger-soft); color: var(--danger); }
.chip.media { background: var(--work-soft); color: var(--work); }
.chip.baja { background: var(--surface-2); color: var(--text-soft); }
.chip.materia { background: var(--accent-soft); color: var(--accent); }
.desc { font-size: 13px; color: var(--text-soft); margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
.meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-soft); }
.meta .m { display: inline-flex; align-items: center; gap: 5px; }
.meta .m.overdue { color: var(--danger); font-weight: 600; }
.progress-wrap { margin-top: 12px; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; padding: 0; }
.progress-row .pval { font-size: 12px; font-weight: 600; color: var(--text-soft); width: 38px; text-align: right; }

/* Estado por etapas */
.status-wrap { margin-top: 12px; }
.status-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.spill {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
  font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; cursor: pointer; transition: .15s;
}
.spill:hover { border-color: var(--accent); color: var(--accent); }
.spill.on { background: var(--surface-2); }
.status-bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.status-bar i { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
.status-cap { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-soft); margin-top: 5px; }
.timer {
  display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px;
  background: var(--surface-2); border-radius: 10px; font-variant-numeric: tabular-nums;
}
.timer .time { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.timer.running .time { color: var(--ok); }
.timer .tbtn {
  width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer;
  display: grid; place-items: center; background: var(--surface); color: var(--text-soft);
  border: 1px solid var(--border); transition: .15s;
}
.timer .tbtn:hover { color: var(--text); }
.timer .tbtn.play { background: var(--accent); color: #fff; border-color: var(--accent); }
.timer .tlabel { font-size: 11px; color: var(--text-faint); margin-left: auto; }
.card-actions { display: flex; flex-direction: column; gap: 6px; }
.card-actions button {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none;
  color: var(--text-faint); cursor: pointer; display: grid; place-items: center; transition: .15s;
}
.card-actions button:hover { background: var(--surface-2); color: var(--text); }
.card-actions button.del:hover { background: var(--danger-soft); color: var(--danger); }

/* Assignees */
.assignees { display: inline-flex; gap: 4px; align-items: center; }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 1px solid var(--surface); text-transform: uppercase; }
.assignees .names { font-size: 12px; color: var(--text-soft); }

/* Checklist */
.checklist { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.sub { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
.sub .sbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); cursor: pointer; display: grid; place-items: center; color: #fff; flex-shrink: 0; background: transparent; }
.sub .sbox.on { background: var(--ok); border-color: var(--ok); }
.sub .stext { flex: 1; word-break: break-word; }
.sub.done .stext { text-decoration: line-through; color: var(--text-faint); }
.sub .srem { background: none; border: none; color: var(--text-faint); cursor: pointer; opacity: 0; padding: 2px; display: grid; place-items: center; transition: .15s; }
.sub:hover .srem { opacity: 1; }
.sub .srem:hover { color: var(--danger); }
.sub-item { display: flex; flex-direction: column; }
.sub-note {
  margin-left: 26px; margin-top: 2px; margin-bottom: 2px; width: calc(100% - 26px);
  padding: 4px 8px; font-size: 12px; color: var(--text-soft);
  background: transparent; border: 1px solid transparent; border-radius: 6px;
}
.sub-note::placeholder { color: var(--text-faint); }
.sub-note:hover { border-color: var(--border); }
.sub-note:focus { border-color: var(--accent); background: var(--surface); color: var(--text); }
.addsub { display: flex; gap: 6px; margin-top: 4px; }
.addsub input { padding: 6px 10px; font-size: 13px; }
.addsub button { border: 1px dashed var(--border); background: none; color: var(--text-soft); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; white-space: nowrap; }
.addsub button:hover { color: var(--accent); border-color: var(--accent); }

/* Empty */
.empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }
.empty svg { color: var(--text-faint); margin-bottom: 12px; }
.empty h3 { font-size: 16px; color: var(--text); margin-bottom: 4px; }

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(16,24,40,.55); backdrop-filter: blur(3px);
  display: none; align-items: flex-start; justify-content: center; padding: 24px 16px; z-index: 50;
  overflow-y: auto;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); width: 100%;
  max-width: 480px; margin: auto; animation: pop .2s ease; border: 1px solid var(--border);
}
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.modal-head { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.modal-head h2 { font-size: 17px; font-weight: 700; }
.modal-head button { margin-left: auto; background: none; border: none; color: var(--text-faint); cursor: pointer; }
.modal-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

.alert-bar {
  background: var(--work-soft); color: var(--work); border: 1px solid transparent;
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; font-size: 14px;
  font-weight: 500; display: flex; gap: 10px; align-items: center;
}
.alert-bar.danger { background: var(--danger-soft); color: var(--danger); }
.alert-bar svg { flex-shrink: 0; }

/* Screenshot upload */
.shot-drop {
  display: flex; align-items: center; gap: 10px; padding: 14px; cursor: pointer;
  border: 1.5px dashed var(--border); border-radius: 10px; color: var(--text-soft);
  font-size: 13px; transition: .15s;
}
.shot-drop:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.shot-drop svg { flex-shrink: 0; }
.shot-status { font-size: 12px; margin-top: 8px; min-height: 16px; }
.shot-status.load { color: var(--text-soft); }
.shot-status.ok { color: var(--ok); }
.shot-status.err { color: var(--danger); }

/* Puerta de acceso */
.gate {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}
.gate-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow-lg); padding: 36px 28px 30px; max-width: 380px; width: 100%; text-align: center;
}
.gate-mark {
  width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 18px; color: #fff;
  background: linear-gradient(135deg, var(--accent), #7c3aed); display: grid; place-items: center;
}
.gate-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -.02em; }
.gate-card p { color: var(--text-soft); font-size: 14px; margin: 0 auto 18px; max-width: 300px; }
.gate-card p.gate-err { color: var(--danger); font-weight: 500; }
.gate-btn {
  display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: 15px;
  padding: 12px 22px; border-radius: 12px; cursor: pointer; box-shadow: var(--shadow); transition: .15s;
}
.gate-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.gate-local { display: block; margin: 14px auto 0; background: none; border: none; color: var(--text-soft); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
.gate-local:hover { color: var(--text); }

.foot-note { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-faint); }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .field .row2 { grid-template-columns: 1fr; }
  .toolbar .grow { order: 3; width: 100%; flex: 1 0 100%; }
  .hide-sm { display: none; }
  .header-actions .btn.ghost { padding: 10px; }
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div>
        <h1>Mis Tareas</h1>
        <p>Universidad y trabajo, con tiempo y progreso</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn ghost" id="driveBtn" title="Guardar en Google Drive">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8m0 0 3-3m-3 3L9 7M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
        <span class="hide-sm" id="driveLabel">Conectar Drive</span>
      </button>
      <a class="btn ghost" href="https://magenta-wisp-9fe4da.netlify.app" target="_blank" rel="noopener" title="Ir a mis gastos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span class="hide-sm">Mis gastos</span>
      </a>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <div id="alertBar"></div>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="todas">Todas</button>
      <button class="tab" data-cat="universidad">Universidad</button>
      <button class="tab" data-cat="trabajo">Trabajo</button>
    </div>
    <div class="grow search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Buscar tarea...">

      <option value="due">Por fecha</option>
      <option value="priority">Por prioridad</option>
      <option value="progress">Por progreso</option>

    <button class="btn" id="addBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nueva tarea
    </button>
  </div>

  <div class="list" id="list"></div>

  <p class="foot-note">Tus tareas se guardan en este navegador. Nada sale de tu equipo.</p>
</div>

<!-- Puerta de acceso (login con Google) -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="gate-mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>

      <svg class="glogo" width="19" height="19" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-3 .7-4.3v-5.7H4.5C3 17 2 20.4 2 24s1 7 2.5 10z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>
      Entrar con Google
    </button>
    <button class="gate-local" id="gateLocal" hidden>Entrar sin sincronizar (solo este equipo)</button>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nueva tarea</h2>
      <button id="closeModal" aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="form">
      <div class="modal-body">
        <div class="field">
          <label>Crear desde un pantallazo (opcional)</label>
          <label class="shot-drop" for="fShot">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
            <span id="shotText">Sube una captura y leo el texto para rellenar</span>
            <input id="fShot" type="file" accept="image/*" hidden>
          </label>
          <div id="shotStatus" class="shot-status"></div>
        </div>
        <div class="field">
          <label for="fTitle">Título</label>
          <input id="fTitle" required placeholder="Ej: Entregar informe de laboratorio">
        </div>
        <div class="field">
          <label for="fDesc">Detalle (opcional)</label>
          <textarea id="fDesc" rows="2" placeholder="Notas, requisitos, enlaces..."></textarea>
        </div>
        <div class="field">
          <div class="row2">
            <div>
              <label for="fCat">Categoría</label>
              <select id="fCat">
                <option value="universidad">Universidad</option>
                <option value="trabajo">Trabajo</option>
              </select>
            </div>
            <div>
              <label for="fPrio">Prioridad</label>
              <select id="fPrio">
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="fDue">Fecha límite (opcional)</label>
          <input id="fDue" type="date">
        </div>
        <div class="field">
          <label for="fMateria">Materia (universidad, opcional)</label>
          <input id="fMateria" list="materiasList" placeholder="Elige o escribe la materia" autocomplete="off">
          <datalist id="materiasList"></datalist>
        </div>
        <div class="field">
          <label for="fPeople">Personas (sepáralas con comas)</label>
          <input id="fPeople" placeholder="Ej: Yo, Ana, Prof. Ruiz">
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn" id="saveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- Configuración ----
  // Client ID de Google (el mismo de tu app de gastos).
  // Con esto puesto, la app pide iniciar sesión con Google y solo tu cuenta ve tus tareas.
  // Si lo dejas vacío, la app funciona sin login y guarda solo en este navegador.
  var CONFIG = {
    googleClientId: "379552251382-59je16sqnq5foe4v6ndrcs8jvoom48o3.apps.googleusercontent.com"
  };

  // Tus materias del semestre (edítalas cuando cambien). Sirven para etiquetar
  // las tareas de universidad y para que el lector de pantallazos las reconozca.
  var MATERIAS = [
    "Gerencia de Proyectos de TI",
    "Cibernética",
    "Electiva II",
    "Desempeño Ambiental en Ing. de Sistemas",
    "Gestión del Talento Humano"
  ];

  var KEY = "organizador_tareas_v1";
  var THEME_KEY = "organizador_tema";
  var DRIVE_FILE_KEY = "organizador_drive_file_id";
  var DRIVE_FILE_NAME = "organizador-tareas.json";

  // ---- State ----
  var tasks = load();
  var filter = "todas";
  var query = "";
  var sortBy = "created";
  var editingId = null;
  var ticking = {}; // id -> intervalId for live display
  var pendingSubtasks = []; // pasos sugeridos por la IA al leer un pantallazo

  // Drive
  var driveToken = null;
  var driveTokenExp = 0;
  var driveTokenClient = null;
  var driveFileId = null;
  var driveSaveTimer = null;
  try { driveFileId = localStorage.getItem(DRIVE_FILE_KEY) || null; } catch (e) {}

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : seed();
    } catch (e) { return seed(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
    if (driveToken) scheduleDriveSave();
  }
  function seed() {
    var now = Date.now();
    return [
      { id: uid(), title: "Ejemplo: preparar presentación de clase", desc: "Diapositivas + guion de 10 min", cat: "universidad", prio: "alta", due: dateOffset(3), done: false, progress: 30, seconds: 0, running: null, created: now, people: ["Yo", "Ana"], subtasks: [{ text: "Armar el guion", done: true, note: "Listo, quedó en el documento compartido" }, { text: "Diseñar diapositivas", done: false, note: "" }, { text: "Ensayar", done: false, note: "" }] },
      { id: uid(), title: "Ejemplo: enviar reporte semanal", desc: "", cat: "trabajo", prio: "media", due: dateOffset(1), done: false, progress: 0, seconds: 0, running: null, created: now - 1000, people: ["Yo"], subtasks: [] }
    ];
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function dateOffset(days) {
    var d = new Date(); d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  // ---- Time helpers ----
  function elapsed(t) {
    var s = t.seconds || 0;
    if (t.running) s += Math.floor((Date.now() - t.running) / 1000);
    return s;
  }
  function fmt(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return (h > 0 ? h + ":" : "") + p(h > 0 ? m : m) + ":" + p(s);
  }
  function totalTime() {
    return tasks.reduce(function (a, t) { return a + elapsed(t); }, 0);
  }
  function fmtHM(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + "h " + m + "m";
    return m + "m";
  }

  // Estados de una tarea (etapas), cada uno con su avance y color.
  var STATUSES = [
    { key: "sin_revisar", label: "Sin revisar", pct: 0, color: "var(--text-faint)" },
    { key: "revisado", label: "Revisado", pct: 15, color: "var(--uni)" },
    { key: "iniciada", label: "Iniciada", pct: 35, color: "var(--uni)" },
    { key: "media", label: "A la mitad", pct: 55, color: "var(--work)" },
    { key: "casi", label: "Casi lista", pct: 80, color: "var(--work)" },
    { key: "terminada", label: "Terminada", pct: 100, color: "var(--ok)" }
  ];
  function statusByKey(key) {
    for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].key === key) return STATUSES[i];
    return null;
  }
  function statusFor(t) {
    var key = t.status;
    if (!key) {
      // Deriva un estado a partir de datos viejos (progress/done).
      if (t.done) key = "terminada";
      else if ((t.progress || 0) >= 80) key = "casi";
      else if ((t.progress || 0) >= 50) key = "media";
      else if ((t.progress || 0) > 0) key = "iniciada";
      else key = "sin_revisar";
    }
    return statusByKey(key) || STATUSES[0];
  }
  function taskProgress(t) { return statusFor(t).pct; }
  function initials(name) {
    var parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2);
    return parts[0][0] + parts[parts.length - 1][0];
  }

  // ---- Rendering ----
  var listEl = document.getElementById("list");
  var statsEl = document.getElementById("stats");

  function visibleTasks() {
    var arr = tasks.filter(function (t) {
      if (filter !== "todas" && t.cat !== filter) return false;
      if (query && (t.title + " " + (t.desc || "") + " " + (t.materia || "") + " " + (t.people || []).join(" ")).toLowerCase().indexOf(query) === -1) return false;
      return true;
    });
    var prioRank = { alta: 0, media: 1, baja: 2 };
    arr.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (sortBy === "due") {
        if (!a.due) return 1; if (!b.due) return -1;
        return a.due.localeCompare(b.due);
      }
      if (sortBy === "priority") return prioRank[a.prio] - prioRank[b.prio];
      if (sortBy === "progress") return taskProgress(b) - taskProgress(a);
      return b.created - a.created;
    });
    return arr;
  }

  function renderAlert() {
    var bar = document.getElementById("alertBar");
    var today = todayStr();
    var overdue = tasks.filter(function (t) { return !t.done && t.due && t.due < today; });
    var dueToday = tasks.filter(function (t) { return !t.done && t.due === today; });
    if (!overdue.length && !dueToday.length) { bar.innerHTML = ""; return; }
    var parts = [];
    if (overdue.length) parts.push(overdue.length + " atrasada" + (overdue.length > 1 ? "s" : ""));
    if (dueToday.length) parts.push(dueToday.length + " para hoy");
    var danger = overdue.length > 0;
    bar.innerHTML = '<div class="alert-bar ' + (danger ? "danger" : "") + '">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>' +
      'Tienes ' + parts.join(" y ") + '. Revisa para que no se te pase nada.' +
      '</div>';
  }

  function render() {
    renderAlert();
    renderStats();
    var arr = visibleTasks();
    listEl.innerHTML = "";
    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">' +
        '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
        '<h3>Sin tareas aquí</h3><p>Crea una nueva con el botón de arriba.</p></div>';
      return;
    }
    arr.forEach(function (t) { listEl.appendChild(cardEl(t)); });
  }

  function renderStats() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var pending = total - done;
    var pct = total ? Math.round((done / total) * 100) : 0;
    var overdue = tasks.filter(function (t) { return !t.done && t.due && t.due < todayStr(); }).length;
    var enProg = tasks.filter(function (t) { return !t.done && statusFor(t).key !== "sin_revisar"; }).length;
    statsEl.innerHTML =
      stat(total, "Tareas en total") +
      stat(pending, overdue ? overdue + " atrasada" + (overdue > 1 ? "s" : "") : "Pendientes", overdue ? "danger" : "") +
      statBar(pct, done + " de " + total + " completadas") +
      stat(enProg, "En progreso");
  }
  function stat(num, lbl, cls) {
    return '<div class="stat"><div class="num"' + (cls === "danger" ? ' style="color:var(--danger)"' : "") + '>' + num + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
  }
  function statBar(pct, lbl) {
    return '<div class="stat"><div class="num">' + pct + '%</div><div class="lbl">' + esc(lbl) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  }

  function cardEl(t) {
    var el = document.createElement("div");
    el.className = "card cat-" + t.cat + (t.done ? " done" : "");
    var over = !t.done && t.due && t.due < todayStr();
    var cur = statusFor(t);

    el.innerHTML =
      '<button class="check ' + (t.done ? "on" : "") + '" title="Marcar como hecha">' +
        (t.done ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
      '</button>' +
      '<div class="card-body">' +
        '<div class="card-top">' +
          '<span class="title">' + esc(t.title) + '</span>' +
          '<span class="chip ' + t.cat + '">' + (t.cat === "universidad" ? "Universidad" : "Trabajo") + '</span>' +
          '<span class="chip ' + t.prio + '">' + cap(t.prio) + '</span>' +
          (t.materia ? '<span class="chip materia">' + esc(t.materia) + '</span>' : '') +
          (t.people && t.people.length ? '<span class="assignees">' +
            t.people.slice(0, 4).map(function (p) { return '<span class="avatar" title="' + esc(p) + '">' + esc(initials(p)) + '</span>'; }).join("") +
            (t.people.length > 4 ? '<span class="avatar">+' + (t.people.length - 4) + '</span>' : '') +
          '</span>' : '') +
        '</div>' +
        (t.desc ? '<div class="desc">' + esc(t.desc) + '</div>' : '') +
        '<div class="status-wrap">' +
          '<div class="status-pills">' +
            STATUSES.map(function (s) {
              return '<button class="spill' + (s.key === cur.key ? " on" : "") + '" data-status="' + s.key + '"' +
                (s.key === cur.key ? ' style="border-color:' + s.color + ';color:' + s.color + '"' : '') +
                '>' + s.label + '</button>';
            }).join("") +
          '</div>' +
          '<div class="status-bar"><i style="width:' + cur.pct + '%;background:' + cur.color + '"></i></div>' +
          '<div class="status-cap"><span style="color:' + cur.color + '">' + cur.label + '</span><span>' + cur.pct + '%</span></div>' +
        '</div>' +
        '<div class="checklist">' +
          (t.subtasks || []).map(function (s, i) {
            return '<div class="sub-item">' +
              '<div class="sub ' + (s.done ? "done" : "") + '">' +
                '<button class="sbox ' + (s.done ? "on" : "") + '" data-sub="' + i + '">' +
                  (s.done ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
                '</button>' +
                '<span class="stext">' + esc(s.text) + '</span>' +
                '<button class="srem" data-subrem="' + i + '" title="Quitar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
              '</div>' +
              '<input class="sub-note" data-note="' + i + '" placeholder="Nota: qué se hizo en este paso..." value="' + esc(s.note || "") + '">' +
            '</div>';
          }).join("") +
          '<div class="addsub"><input data-subinput placeholder="Agregar paso..."><button data-subadd>Añadir paso</button></div>' +
        '</div>' +
        '<div class="meta">' +
          (t.due ? '<span class="m ' + (over ? "overdue" : "") + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' + fmtDate(t.due) + (over ? " (atrasada)" : "") + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button data-edit title="Editar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
        '<button class="del" data-del title="Eliminar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
      '</div>';

    // Wire events
    el.querySelector(".check").onclick = function () { toggleDone(t.id); };
    el.querySelector("[data-edit]").onclick = function () { openModal(t.id); };
    el.querySelector("[data-del]").onclick = function () { removeTask(t.id); };
    el.querySelectorAll("[data-status]").forEach(function (b) {
      b.onclick = function () { setStatus(t.id, b.dataset.status); };
    });
    el.querySelectorAll("[data-sub]").forEach(function (b) {
      b.onclick = function () { toggleSub(t.id, parseInt(b.dataset.sub, 10)); };
    });
    el.querySelectorAll("[data-subrem]").forEach(function (b) {
      b.onclick = function () { removeSub(t.id, parseInt(b.dataset.subrem, 10)); };
    });
    el.querySelectorAll("[data-note]").forEach(function (inp) {
      inp.onchange = function () { setSubNote(t.id, parseInt(inp.dataset.note, 10), inp.value); };
    });
    var subInput = el.querySelector("[data-subinput]");
    var subAdd = el.querySelector("[data-subadd]");
    function doAdd() { if (subInput.value.trim()) { addSub(t.id, subInput.value.trim()); } }
    subAdd.onclick = doAdd;
    subInput.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); doAdd(); } };

    return el;
  }

  // ---- Actions ----
  function toggleDone(id) {
    var t = byId(id); if (!t) return;
    t.done = !t.done;
    if (t.done) { t.status = "terminada"; t.progress = 100; }
    else {
      if (!t.status || t.status === "terminada") t.status = "iniciada";
      var st = statusByKey(t.status);
      t.progress = st ? st.pct : 0;
    }
    save(); clearTicks(); render();
  }
  function setStatus(id, key) {
    var t = byId(id); if (!t) return;
    var st = statusByKey(key); if (!st) return;
    t.status = key;
    t.progress = st.pct;
    t.done = (key === "terminada");
    save(); clearTicks(); render();
  }
  function removeTask(id) {
    var t = byId(id); if (!t) return;
    if (!confirm('¿Eliminar "' + t.title + '"?')) return;
    tasks = tasks.filter(function (x) { return x.id !== id; });
    save(); clearTicks(); render();
  }
  function addSub(id, text) {
    var t = byId(id); if (!t) return;
    if (!t.subtasks) t.subtasks = [];
    t.subtasks.push({ text: text, done: false });
    save(); clearTicks(); render();
  }
  function toggleSub(id, i) {
    var t = byId(id); if (!t || !t.subtasks[i]) return;
    t.subtasks[i].done = !t.subtasks[i].done;
    save(); clearTicks(); render();
  }
  function removeSub(id, i) {
    var t = byId(id); if (!t || !t.subtasks) return;
    t.subtasks.splice(i, 1);
    save(); clearTicks(); render();
  }
  function setSubNote(id, i, note) {
    var t = byId(id); if (!t || !t.subtasks[i]) return;
    t.subtasks[i].note = note;
    save(); // sin re-render, para no interrumpir mientras escribes
  }

  function clearTicks() {
    Object.keys(ticking).forEach(function (k) { clearInterval(ticking[k]); });
    ticking = {};
  }

  // ---- Modal ----
  var overlay = document.getElementById("overlay");
  var form = document.getElementById("form");

  // Llena el desplegable de materias con tu lista.
  (function () {
    var dl = document.getElementById("materiasList");
    if (dl) dl.innerHTML = MATERIAS.map(function (m) { return '<option value="' + esc(m) + '">'; }).join("");
  })();
  function openModal(id) {
    editingId = id || null;
    document.getElementById("modalTitle").textContent = id ? "Editar tarea" : "Nueva tarea";
    document.getElementById("saveBtn").textContent = id ? "Guardar cambios" : "Guardar";
    pendingSubtasks = [];
    if (shotInput) { shotInput.value = ""; }
    if (shotText) { shotText.textContent = "Sube una captura y leo el texto para rellenar"; }
    if (shotStatus) { shotStatus.textContent = ""; shotStatus.className = "shot-status"; }
    if (id) {
      var t = byId(id);
      form.fTitle.value = t.title;
      form.fDesc.value = t.desc || "";
      form.fCat.value = t.cat;
      form.fPrio.value = t.prio;
      form.fDue.value = t.due || "";
      form.fMateria.value = t.materia || "";
      form.fPeople.value = (t.people || []).join(", ");
    } else {
      form.reset();
      form.fCat.value = filter !== "todas" ? filter : "universidad";
      form.fPrio.value = "media";
    }
    overlay.classList.add("open");
    setTimeout(function () { form.fTitle.focus(); }, 50);
  }
  function closeModal() { overlay.classList.remove("open"); editingId = null; }

  form.onsubmit = function (e) {
    e.preventDefault();
    var data = {
      title: form.fTitle.value.trim(),
      desc: form.fDesc.value.trim(),
      cat: form.fCat.value,
      prio: form.fPrio.value,
      due: form.fDue.value || "",
      materia: form.fMateria.value.trim(),
      people: form.fPeople.value.split(",").map(function (p) { return p.trim(); }).filter(Boolean)
    };
    if (!data.title) return;
    if (editingId) {
      var t = byId(editingId);
      t.title = data.title; t.desc = data.desc; t.cat = data.cat; t.prio = data.prio; t.due = data.due; t.materia = data.materia; t.people = data.people;
    } else {
      tasks.push({
        id: uid(), title: data.title, desc: data.desc, cat: data.cat, prio: data.prio,
        due: data.due, materia: data.materia, people: data.people, done: false, status: "sin_revisar", progress: 0,
        subtasks: pendingSubtasks, created: Date.now()
      });
    }
    pendingSubtasks = [];
    save(); closeModal(); clearTicks(); render();
  };

  document.getElementById("addBtn").onclick = function () { openModal(null); };
  document.getElementById("closeModal").onclick = closeModal;
  document.getElementById("cancelBtn").onclick = closeModal;
  overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  // ---- Toolbar ----
  document.getElementById("tabs").onclick = function (e) {
    var btn = e.target.closest(".tab"); if (!btn) return;
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    filter = btn.dataset.cat;

  function ensureTokenClient() {
    if (driveTokenClient) return true;
    if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.googleClientId,
      scope: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata",
      callback: function (resp) {
        if (resp && resp.access_token) {
          driveToken = resp.access_token;
          driveTokenExp = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3300000) - 60000;
          try { localStorage.setItem(CONN_KEY, "1"); } catch (e) {}
          silentMode = false;
          setDriveLabel("Sincronizando...");
          syncWithDrive();

          if (silentMode) { silentMode = false; if (gated) showGate(); }

      error_callback: function (err) {

        if (silentMode) { silentMode = false; if (gated) showGate(); setDriveLabel("Conectar Drive"); return; }
        var t = (err && err.type) ? err.type : "error";
        if (gated) showGate("No se pudo abrir la ventana de Google (" + t + "). Permite las ventanas emergentes del sitio y reintenta.");
        setDriveLabel("Conectar Drive");

  function connectDrive() {
    if (!CONFIG.googleClientId) {

    if (!ensureTokenClient()) {
      var msg = "Google todavía no cargó. Espera unos segundos y reintenta.";
      if (gated) showGate(msg); else alert(msg);
      return;
    }
    silentMode = false; // es un clic del usuario: aquí sí abrimos ventana y mostramos errores reales

  // Reconexión silenciosa al abrir, si ya iniciaste sesión antes en este navegador.
  function autoConnectDrive() {
    if (!CONFIG.googleClientId) return;
    var connectedBefore = false;
    try { connectedBefore = localStorage.getItem(CONN_KEY) === "1"; } catch (e) {}
    if (!connectedBefore) return;
    var tries = 0;
    var iv = setInterval(function () {
      if (ensureTokenClient()) {
        clearInterval(iv);
        silentMode = true; // intento automático: si falla, no mostramos error
        try { driveTokenClient.requestAccessToken({ prompt: "" }); } catch (e) { silentMode = false; }

  function syncWithDrive() {

  // Devuelve un token válido, renovándolo en silencio si venció (sin pedir login otra vez).
  function ensureToken() {
    if (driveToken && Date.now() < driveTokenExp) return Promise.resolve(driveToken);
    return new Promise(function (resolve, reject) {
      if (!ensureTokenClient()) { reject(new Error("Google no cargó")); return; }
      var prev = driveTokenClient.callback;
      driveTokenClient.callback = function (r) {
        driveTokenClient.callback = prev;
        if (r && r.access_token) {
          driveToken = r.access_token;
          driveTokenExp = Date.now() + (r.expires_in ? r.expires_in * 1000 : 3300000) - 60000;
          try { localStorage.setItem(CONN_KEY, "1"); } catch (e) {}
          resolve(driveToken);
        } else {
          reject(new Error("no se pudo renovar el acceso"));
        }
      };
      try { driveTokenClient.requestAccessToken({ prompt: "" }); }
      catch (e) { driveTokenClient.callback = prev; reject(e); }
    });
  }

  function driveFetch(url, opts) {
    return ensureToken().then(function (token) {
      opts = opts || {};
      opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
      return fetch(url, opts);
    }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error("Drive " + r.status + " " + String(t).slice(0, 120)); });
      }
      return r;
    });
  }

  function findDriveFile() {
    if (driveFileId) return Promise.resolve(driveFileId);
    var q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
    return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,name)")
      .then(function (r) { return r.json(); })
      .then(function (d) { return d.files && d.files.length ? d.files[0].id : null; });
  }

  function loadDriveFile() {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + driveFileId + "?alt=media")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (Array.isArray(data)) tasks = data;
        else if (data && Array.isArray(data.tasks)) tasks = data.tasks;
        try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
        clearTicks(); render();
      });

  function createDriveFile() {
    var boundary = "org" + Date.now();
    var meta = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
    var body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(meta) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" +
      JSON.stringify(tasks) + "\r\n--" + boundary + "--";
    return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST",
      headers: { "Content-Type": "multipart/related; boundary=" + boundary },
      body: body
    }).then(function (r) { return r.json(); }).then(function (d) {
      driveFileId = d.id;
      try { localStorage.setItem(DRIVE_FILE_KEY, d.id); } catch (e) {}
    });
  }

  // ---- Pantallazo con OCR (en el navegador, sin servidor ni licencias) ----

  shotInput.onchange = function () {
    var file = shotInput.files && shotInput.files[0];
    if (!file) return;
    if (typeof Tesseract === "undefined") { setShot("El lector aún no cargó. Espera unos segundos y reintenta.", "err"); return; }
    shotText.textContent = file.name;
    setShot("Leyendo el texto de la imagen...", "load");
    downscale(file).then(function (dataUrl) {
      return Tesseract.recognize(dataUrl, "spa+eng");
    }).then(function (result) {
      var text = (result && result.data && result.data.text) ? result.data.text : "";
      if (!text.trim()) { setShot("No encontré texto en la imagen. Escríbela a mano.", "err"); return; }
      fillFromText(text);
      setShot("Texto leído. Revisa y ajusta los datos.", "ok");
    }).catch(function (e) {
      console.error(e);
      setShot("No se pudo leer la imagen. Escríbela a mano.", "err");
    });
  };

  function setShot(text, cls) { shotStatus.textContent = text; shotStatus.className = "shot-status " + (cls || ""); }

  function downscale(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("imagen inválida")); };
      img.src = url;
    });
  }

  // Heurísticas simples para rellenar la tarea a partir del texto leído.
  function fillFromText(text) {
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    var low = text.toLowerCase();

    // Fecha límite: primero la que sigue a "Cierre/Entrega/Vence/Límite".
    var due = findDueDate(text);
    if (due) form.fDue.value = due;

    // Título: 1) "Asunto"/"Re:" de un correo; 2) el nombre en las migas de pan; 3) primera línea real.
    var title = subjectTitle(lines) || headingFromCrumbs(lines) || firstRealLine(lines) || (lines[0] || "");
    title = cleanTitle(dedupe(title)).slice(0, 100);
    form.fTitle.value = title;

    // Detalle: solo el cuerpo (mensaje del ticket o enunciado), sin campos ni firma.
    form.fDesc.value = extractBody(lines, title).slice(0, 1400);

    // Persona: el cliente o solicitante, si el pantallazo lo trae.
    var person = extractPerson(lines);
    if (person && !form.fPeople.value.trim()) form.fPeople.value = person;

    // Categoría por puntaje: cuenta señales de universidad vs. trabajo y gana la mayor.
    var uniKW = low.match(/\b(clase|profesor|profesora|universidad|examen|parcial|semestre|c[aá]tedra|materia|laboratorio|ensayo|tesis|taller|aula|corte|docente|sustentaci[oó]n|m[oó]dulo|objetivo de aprendizaje|entregable|r[uú]brica)\b/g) || [];
    var workKW = low.match(/\b(pqr|ticket|requerimiento|soporte|cliente|factura|cuenta contable|contable|odoo|egresos|recibos|asunto|remitente|coordinador|auxiliar|woden|colaborador|etapa|solicito|cordialmente|saludos cordiales|reporte|informe|oficina|jefe|reuni[oó]n)\b/g) || [];
    if (/\[ext\]/.test(low)) workKW.push("ext");
    if (workKW.length > uniKW.length) form.fCat.value = "trabajo";
    else if (uniKW.length > workKW.length) form.fCat.value = "universidad";

    // Materia: para universidad, la deduce y la ajusta a tu lista si coincide.
    if (form.fCat.value === "universidad") {
      var materia = matchMateria(extractMateria(lines));
      if (materia) form.fMateria.value = materia;
    }

    // Prioridad: lee "Prioridad baja/media/alta" o palabras de urgencia.
    var pm = low.match(/prioridad\s+(alta|media|baja)/);
    if (pm) form.fPrio.value = pm[1];
    else if (/\b(urgente|inmediato|prioridad alta|importante|hoy)\b/.test(low)) form.fPrio.value = "alta";
  }

  // Busca el asunto de un correo (línea "Asunto:" o que empieza por "Re:/Fwd:").
  function subjectTitle(lines) {
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^\s*(asunto|subject)\s*:?\s*(.+)$/i);
      if (m && m[2].trim().length > 2) return m[2].trim();
      if (/^\s*(re|rv|fwd|fw)\s*:/i.test(lines[i])) return lines[i];
    }
    return "";
  }

  // En sistemas web el nombre de la tarea suele estar en las migas de pan
  // (con > o /). Si ese mismo texto aparece además como encabezado, es el título.
  function isCrumbLine(ln) { return /\s[>›»]\s/.test(ln) || (ln.match(/\s\/\s/g) || []).length >= 2; }
  function headingFromCrumbs(lines) {
    // Junta el texto de todas las migas de pan.
    var crumbText = "";
    lines.forEach(function (ln) { if (isCrumbLine(ln)) crumbText += " " + norm(ln); });
    if (!crumbText) return "";
    // Busca un encabezado normal cuyo texto también esté dentro de las migas.
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (isCrumbLine(ln)) continue;
      var clean = cleanTitle(ln).trim();
      if (clean.length < 10) continue;
      if (/^[\W_]+$/.test(clean)) continue;
      if (crumbText.indexOf(norm(clean)) > -1) return clean;
    }
    return "";
  }
  function cleanCrumb(s) { return String(s || "").replace(/\s*\(#?\d+\)\s*$/, "").trim(); }
  function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }

  // Primera línea "de verdad": ni basura, ni migas de pan, ni etiqueta de formulario, ni saludo.
  function firstRealLine(lines) {
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (ln.length < 8) continue;
      if (/[>›»]/.test(ln)) continue;                                   // migas de pan (>)
      if ((ln.match(/\s\/\s/g) || []).length >= 2) continue;            // migas de pan (/)
      if ((ln.match(/[—–|·•]/g) || []).length >= 2) continue;           // barra de menú
      if (/^[\W_]+$/.test(ln)) continue;                                // solo símbolos
      if (/@/.test(ln) && ln.split(" ").length <= 3) continue;          // correo suelto
      if (/^(apertura|cierre|entrega|fecha|vence|hasta)\b/i.test(ln)) continue;
      if (/^(tk|nivel|pa[ií]s|prioridad|tipo|categor[ií]a|clasificaci[oó]n|m[eé]todo|tat|equipo|cliente|correo|tel[eé]fono|asignado|nombre|para|de|cc|para:|asunto)\b/i.test(ln) && ln.length < 32) continue;
      if (/^(buenos d[ií]as|buenas|estimad|hola|cordial|saludos|atentamente|gracias|quedo|quedamos)\b/i.test(ln)) continue;
      if (/\b\d{1,2}\s+de\s+[a-záéíóú]+\s+de\s+\d{4}\b/i.test(ln)) continue; // línea de fecha
      return ln;
    }
    return "";
  }

  // Extrae solo el cuerpo: el mensaje del ticket o el enunciado, sin campos ni firma.
  function extractBody(lines, title) {
    var label = /^(tk|nivel|pa[ií]s|prioridad|tipo\b|tipo de cliente|tipo pqr|categor[ií]a|clasificaci[oó]n|m[eé]todo|tat|equipo|cliente|correo|tel[eé]fono|asignado|nombre del cliente|fecha report|cc|apertura|cierre|vence|entrega|hasta)\b/i;
    var greet = /^(buen[oa]s?\b|buen d[ií]a|hola\b|estimad|cordial saludo)/i;
    var closing = /^(atentamente|cordialmente|saludos|gracias\b|un cordial)/i;
    var footer = /(woden|www\.|https?:|tel[:.]|cel[:.]|\bdir[:.]|calle\s*\d|carrera\s*\d|\bav\.|jefe de|coordinador de|auxiliar de|gerente\b|analista\b|consultor|innovaci[oó]n de productos|\+?\d[\d ]{7,})/i;
    var attach = /\.(pdf|xlsx?|docx?|pptx?|zip)\b.*\d{1,2}\s+de\s+[a-záéíóú]+\s+de\s+\d{4}/i;
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (norm(cleanTitle(l)) === norm(title)) continue;
      if (isCrumbLine(l) || (l.match(/[—–|·•]/g) || []).length >= 2) continue;
      if (closing.test(l)) break;                    // a partir de la despedida, es firma
      if (label.test(l) || greet.test(l) || footer.test(l) || attach.test(l)) continue;
      var nonspace = l.replace(/\s/g, "").length;
      if (nonspace <= 3) continue;
      var letters = (l.match(/[a-záéíóúñ]/gi) || []).length;
      if (letters / nonspace < 0.55) continue;
      out.push(l);
    }
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  // Extrae el nombre del cliente/solicitante (quitando correo y comillas).
  function extractPerson(lines) {
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/nombre del cliente\s*\??\s*(.+)/i) || lines[i].match(/^\s*cliente\s*\??\s*(.+)/i);
      if (m) {
        var v = m[1].replace(/<[^>]*>/g, "").replace(/["“”]/g, "").replace(/\s+/g, " ").trim();
        v = v.replace(/[<(@].*$/, "").trim();
        if (v.length >= 3 && /[a-záéíóú]/i.test(v)) return v.slice(0, 40);
      }
    }
    return "";
  }

  // Ajusta la materia leída a tu lista MATERIAS (tolera nombres cortados por el OCR).
  function matchMateria(raw) {
    if (!raw) return "";
    var r = norm(raw);
    var best = "", score = 0;
    MATERIAS.forEach(function (m) {
      var mn = norm(m);
      if (r.indexOf(mn) > -1 || mn.indexOf(r) > -1) { best = m; score = 999; return; }
      var rw = r.split(" ").filter(function (w) { return w.length >= 4; });
      var mw = mn.split(" ").filter(function (w) { return w.length >= 4; });
      var c = 0;
      rw.forEach(function (w) {
        mw.forEach(function (x) { if (x.indexOf(w) === 0 || w.indexOf(x) === 0) c++; });
      });
      if (c > score) { score = c; best = m; }
    });
    return score >= 1 ? best : raw;
  }

  // Materia: el primer nivel de las migas de pan (con >), sin el código del curso.
  function extractMateria(lines) {
    for (var i = 0; i < lines.length; i++) {
      if (/\s[>›»]\s/.test(lines[i])) {
        var first = lines[i].split(/\s[>›»]\s/)[0].trim();
        first = first.replace(/^[.\s]+/, "").replace(/[-–]\s*\d[\d\-]*\s*$/, "").trim();
        if (first.length >= 4) return first.slice(0, 60);
      }
    }
    return "";
  }

  // Quita prefijos de correo (Re:, Fwd:) y etiquetas tipo [EXT] al inicio del título.
  function cleanTitle(s) {
    var out = s || "";
    for (var i = 0; i < 4; i++) {
      out = out.replace(/^\s*(re|rv|fwd|fw)\s*:\s*/i, "").replace(/^\s*\[[^\]]*\]\s*/, "");
    }
    return out.trim();
  }

  // El OCR a veces repite la frase ("Taller X desde la Taller X desde la ..."). La colapsamos.
  function dedupe(s) {
    if (!s) return s;
    var words = s.split(/\s+/);
    if (words.length < 4) return s;
    var key = words.slice(0, 3).join(" ").toLowerCase();
    var low = s.toLowerCase();
    var first = low.indexOf(key);
    if (first > -1) {
      var second = low.indexOf(key, first + key.length);
      if (second > -1) return s.slice(second).trim();
    }
    return s;
  }

  var MESES_ES = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
  function findDueDate(text) {
    function iso(d, mes, y) { var m = MESES_ES[String(mes).toLowerCase()]; return m ? (y + "-" + pad2(m) + "-" + pad2(d)) : ""; }
    // 1) fecha en español que sigue a una palabra de entrega
    var mk = text.match(/(cierre|entrega|vence|fecha\s*l[ií]mite|hasta)[^0-9]{0,40}?(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
    if (mk) { var r1 = iso(mk[2], mk[3], mk[4]); if (r1) return r1; }
    // 2) cualquier fecha en español (la última suele ser la de cierre)
    var re = /(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/ig, m, last = null;
    while ((m = re.exec(text))) last = m;
    if (last) { var r2 = iso(last[1], last[2], last[3]); if (r2) return r2; }
    // 3) formatos numéricos
    var isoNum = text.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (isoNum) return isoNum[1] + "-" + pad2(isoNum[2]) + "-" + pad2(isoNum[3]);
    var dmy = text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})\b/);
    if (dmy) { var yy = dmy[3].length === 2 ? "20" + dmy[3] : dmy[3]; return yy + "-" + pad2(dmy[2]) + "-" + pad2(dmy[1]); }
    return "";
  }
  function pad2(n) { n = String(n); return n.length < 2 ? "0" + n : n; }

  // ---- Utils ----
  function byId(id) { return tasks.find(function (t) { return t.id === id; }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function fmtDate(iso) {
    var parts = iso.split("-");
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var months = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }

  // Save running timers before leaving so nothing is lost
  window.addEventListener("beforeunload", function () {
    tasks.forEach(function (t) { if (t.running) { t.seconds = elapsed(t); t.running = null; } });
    save();
  });

  // Al volver a la pestaña, renueva el acceso en silencio para no cerrar la sesión.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && gated && driveFileId) {
      ensureToken().catch(function () {});
    }
  });

  // Arranque: con Client ID exigimos login (puerta); sin él, modo local.
  if (gated) {
    showGate();
    var gisTries = 0;
    var gisIv = setInterval(function () {
      if (ensureTokenClient()) { clearInterval(gisIv); autoConnectDrive(); }
      else if (++gisTries > 60) { clearInterval(gisIv); showGate("No cargó Google. Revisa tu conexión y refresca la página."); }
    }, 150);
  } else { render(); }
})();
</script>
